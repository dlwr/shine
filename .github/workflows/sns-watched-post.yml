name: SNS Watched Post

on:
  schedule:
    # 土曜13:00 JST。クイズ告知(12:00 JST)と同じ日でも重ならないよう1時間ずらす
    # 実際の起動はGitHub Actionsの都合で数時間遅れることがある
    - cron: '0 4 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--watched'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
