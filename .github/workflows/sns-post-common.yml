name: SNS Post (common)

on:
  workflow_call:
    inputs:
      args:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
      announcement:
        type: string
        default: ''
      last_day_of_month_only:
        type: boolean
        default: false

jobs:
  schedule-check:
    if: inputs.last_day_of_month_only && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.last-day.outputs.skip }}
    steps:
      - name: Check whether today is the last day of the month (JST)
        id: last-day
        run: echo "skip=$([ "$(TZ=Asia/Tokyo date -d tomorrow +%d)" = "01" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  post:
    needs: schedule-check
    if: ${{ !cancelled() && needs.schedule-check.result != 'failure' && needs.schedule-check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Post
        working-directory: apps/scrapers
        run: pnpm run cli sns-post ${{ inputs.args }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANNOUNCEMENT: ${{ inputs.announcement }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          D1_PROXY_URL: ${{ secrets.D1_PROXY_URL }}
          D1_PROXY_KEY: ${{ secrets.D1_PROXY_KEY }}
          NORTH_STAR_OWNER_IPS: ${{ secrets.NORTH_STAR_OWNER_IPS }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
