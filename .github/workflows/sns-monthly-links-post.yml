name: SNS Monthly Links Post

on:
  schedule:
    # 毎日 12:00 JST。今月の1本に他人の記事・ポストが付いていたら紹介する
    - cron: '0 3 * * *'
  # API が今月の1本に他人のリンクが付いた時に送る（GITHUB_DISPATCH_TOKEN）
  repository_dispatch:
    types: [monthly-link-posted]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--monthly-links'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
