name: SNS Announce

on:
  workflow_dispatch:
    inputs:
      announcement:
        description: 'apps/scrapers/data/sns-announcements/ のファイル名(拡張子なし)'
        type: string
        required: true
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--announce "$ANNOUNCEMENT"'
      dry_run: ${{ inputs.dry_run || false }}
      announcement: ${{ inputs.announcement }}
    secrets: inherit
