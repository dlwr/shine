name: SNS Monthly Roundup Post

on:
  schedule:
    # 毎月28〜31日 10:00 JST に起動し、JST で月末の日だけ投稿する
    - cron: '0 1 28-31 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether today is the last day of the month (JST)
        id: last-day
        run: echo "yes=$([ "$(TZ=Asia/Tokyo date -d tomorrow +%d)" = "01" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Post this month's roundup
        if: github.event_name == 'workflow_dispatch' || steps.last-day.outputs.yes == 'true'
        working-directory: apps/scrapers
        run: pnpm run sns-post --monthly-roundup ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
