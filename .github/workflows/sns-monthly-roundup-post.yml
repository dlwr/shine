name: SNS Monthly Roundup Post

on:
  schedule:
    # 毎月28〜31日 10:00 JST に起動し、JST で月末の日だけ投稿する
    - cron: '0 1 28-31 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--monthly-roundup'
      dry_run: ${{ inputs.dry_run || false }}
      last_day_of_month_only: true
    secrets: inherit
