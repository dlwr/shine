name: SNS Monthly Post

on:
  schedule:
    # 毎月1日 10:00 JST。日替わり(09:20 JST)の後に今月の1本を出す
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--monthly'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
