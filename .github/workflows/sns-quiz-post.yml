name: SNS Quiz Post

on:
  schedule:
    # デイリー投稿(09:20 JST)と離して昼に告知する
    # 実際の起動はGitHub Actionsの都合で数時間遅れることがある
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--quiz'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
