name: SNS Person Post

on:
  schedule:
    # 水曜13:00 JST。クイズ告知(12:00 JST)と重ならないよう1時間ずらす
    # 実際の起動はGitHub Actionsの都合で数時間遅れることがある
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--person'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
