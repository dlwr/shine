name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN が未設定のためデプロイをスキップしました。Cloudflareダッシュボード > My Profile > API Tokens で 'Edit Cloudflare Workers' テンプレートからトークンを作成し、gh secret set CLOUDFLARE_API_TOKEN で登録してください。"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        if: steps.token.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        if: steps.token.outputs.available == 'true'
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        if: steps.token.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy API (production)
        if: steps.token.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run api:deploy:prod

      - name: Deploy Frontend (production)
        if: steps.token.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run front:deploy:prod
