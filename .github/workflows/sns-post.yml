name: SNS Daily Post

on:
  schedule:
    # セレクション切替(00:00 UTC = 09:00 JST)の後に実行
    # 実際の起動はGitHub Actionsの都合で数時間遅れることがある
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
