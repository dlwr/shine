name: VRT

on:
  pull_request:
    paths:
      - 'apps/front/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vrt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # runner によってはミラーからの取得が細って止まるので、.deb を cache に置いて apt を通さない
      - name: Restore CJK font packages
        id: font-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/font-debs
          key: fonts-noto-cjk-noble-v1

      - name: Download CJK font packages
        if: steps.font-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          sed -i -e 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' -e 's|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "20";\nAcquire::Retries "3";\n' > /etc/apt/apt.conf.d/99ci
          mkdir -p /tmp/font-debs/partial
          scripts/retry.sh timeout 180 sh -c 'apt-get update && apt-get install -y -qq --download-only -o Dir::Cache::Archives=/tmp/font-debs fonts-noto-cjk'
          rm -rf /tmp/font-debs/partial /tmp/font-debs/lock

      - name: Save CJK font packages
        if: steps.font-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/font-debs
          key: fonts-noto-cjk-noble-v1

      - name: Install CJK fonts
        run: dpkg -i /tmp/font-debs/*.deb

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright version
        run: test "$(node -p "require('./apps/front/node_modules/@playwright/test/package.json').version")" = 1.64.0 || { echo "container の image の版を @playwright/test に合わせる"; exit 1; }

      - name: VRT
        id: vrt
        run: pnpm --filter @shine/front run vrt

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vrt-report
          path: apps/front/playwright-report
          retention-days: 14

      - name: Update failed snapshots
        if: failure() && steps.vrt.outcome == 'failure'
        run: pnpm --filter @shine/front run vrt --last-failed --update-snapshots

      - name: Upload snapshots
        if: failure() && steps.vrt.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: vrt-snapshots
          path: apps/front/vrt/__screenshots__
          retention-days: 14
