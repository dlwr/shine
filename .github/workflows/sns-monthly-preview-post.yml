name: SNS Monthly Preview Post

on:
  schedule:
    # 毎月20日 10:00 JST。来月の1本の予告（観る手段を用意する時間をつくる）
    - cron: '0 1 20 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--monthly-preview'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
