name: SNS Monthly Reminder Post

on:
  schedule:
    # 毎月15日 10:00 JST。今月の1本の再告知と集まった記事・ポストの件数
    - cron: '0 1 15 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '本文の確認のみ(投稿しない)'
        type: boolean
        default: false

jobs:
  post:
    uses: ./.github/workflows/sns-post-common.yml
    with:
      args: '--monthly-reminder'
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
