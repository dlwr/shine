name = "shine-api"
main = "src/index.ts"
compatibility_date = "2025-03-26"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "shine-api"
# Environment variables are loaded from .dev.vars file

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "62b23e51b6614819adbc5454a0930687"

[[env.development.ratelimits]]
name = "SUGGEST_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 10 }

[[env.development.ratelimits]]
name = "AVAILABILITY_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.development.ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[env.production]
name = "shine-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "shine-main"
database_id = "ef1ae873-1ab5-4b99-aa60-9673857c0974"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "62b23e51b6614819adbc5454a0930687"

[[env.production.ratelimits]]
name = "SUGGEST_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 10 }

[[env.production.ratelimits]]
name = "AVAILABILITY_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true
