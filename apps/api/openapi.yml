openapi: '3.1.0'
info:
  title: SHINE Movie Database API
  description: |
    SHINE is a comprehensive movie database API designed to be the world's most organized movie database.
    It collects and organizes movie information, awards, nominations, and multilingual translations.

    **Features:**
    - Date-seeded movie selections (daily/weekly/monthly)
    - Comprehensive awards and nominations tracking
    - Multilingual movie title support
    - User-submitted article links
    - Admin management interface

    **Authentication:**
    - Public endpoints require no authentication
    - Admin endpoints require JWT Bearer token

    **Rate Limiting:**
    - Article link submissions: 10 per hour per IP
  version: 1.0.0
  contact:
    name: SHINE Movie Database
    url: https://shine-film.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.shine-film.com
    description: Production server

paths:
  /:
    get:
      summary: Get date-seeded movie selections
      description: Returns daily, weekly, and monthly movie selections using deterministic hash-based algorithms
      operationId: getMovieSelections
      tags:
        - Movies
      security: []
      parameters:
        - name: locale
          in: query
          description: Language preference for movie titles
          required: false
          schema:
            type: string
            enum: [en, ja]
            default: en
      responses:
        '200':
          description: Successfully retrieved movie selections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieSelections'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /selections/{type}/history:
    get:
      summary: Get recent selections per type
      description: Returns recent movie selections of the given type in reverse chronological order, e.g. for archive pages or RSS feeds
      operationId: getSelectionHistory
      tags:
        - Movies
      security: []
      parameters:
        - name: type
          in: path
          description: Selection period type
          required: true
          schema:
            type: string
            enum: [daily, weekly, monthly]
        - name: locale
          in: query
          description: Language preference for movie titles
          required: false
          schema:
            type: string
            enum: [en, ja]
            default: ja
        - name: limit
          in: query
          description: Maximum number of items to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 14
      responses:
        '200':
          description: Successfully retrieved selection history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [uid, title, selectionDate]
                      properties:
                        uid:
                          type: string
                          format: uuid
                        title:
                          type: string
                        year:
                          type: integer
                        selectionDate:
                          type: string
                          format: date
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/search:
    get:
      summary: Search movies
      description: Search and filter movies with pagination support
      operationId: searchMovies
      tags:
        - Movies
      security: []
      parameters:
        - name: q
          in: query
          description: Search query for movie titles
          required: false
          schema:
            type: string
            maxLength: 100
        - name: year
          in: query
          description: Filter by release year
          required: false
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
        - name: language
          in: query
          description: Filter by original language
          required: false
          schema:
            type: string
            pattern: '^[a-z]{2}$'
        - name: hasAwards
          in: query
          description: Filter movies with awards/nominations
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Successfully retrieved search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieSearchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/{id}:
    get:
      summary: Get movie details
      description: Retrieve detailed information about a specific movie including translations, posters, and nominations
      operationId: getMovieById
      tags:
        - Movies
      security: []
      parameters:
        - name: id
          in: path
          description: Movie unique identifier
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved movie details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/{id}/related:
    get:
      summary: Get related movies
      description: Returns movies sharing an award category with the given movie, winners first
      operationId: getRelatedMovies
      tags:
        - Movies
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: locale
          in: query
          description: Language preference for movie titles
          required: false
          schema:
            type: string
            enum: [en, ja]
            default: ja
        - name: limit
          in: query
          description: Maximum number of movies to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        '200':
          description: Successfully retrieved related movies
          content:
            application/json:
              schema:
                type: object
                required: [movies]
                properties:
                  movies:
                    type: array
                    items:
                      type: object
                      required: [uid, title]
                      properties:
                        uid:
                          type: string
                          format: uuid
                        title:
                          type: string
                        year:
                          type: integer
                        posterUrl:
                          type: string
                          format: uri
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /awards:
    get:
      summary: List award pages
      description: Returns all award and editorial list pages that have nominations
      operationId: listAwards
      tags:
        - Awards
      security: []
      responses:
        '200':
          description: Successfully retrieved award pages
          content:
            application/json:
              schema:
                type: object
                required: [awards]
                properties:
                  awards:
                    type: array
                    items:
                      $ref: '#/components/schemas/AwardSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /people:
    get:
      summary: List people who have a page worth indexing
      description: |
        Returns people credited on at least two films, or credited as director
        on any film, ordered by the number of films they worked on. Soft-deleted
        films are not counted. Intended for the sitemap.
      operationId: listPeople
      tags:
        - Movies
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: People per page; values above 500 are clamped
      responses:
        '200':
          description: Successfully retrieved people
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /people/prominent:
    get:
      summary: Get the most awarded directors and actors
      description: |
        Returns directors and actors ranked by how many times they won a
        personal award (Best Director and the acting awards), then by how many
        times they were nominated. A win or nomination counts once per ceremony
        and category even when several films are attached to it. Soft-deleted
        films are excluded.
      operationId: getProminentPeople
      tags:
        - Movies
      security: []
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum: [ja, en]
            default: ja
          description: Language for names and film titles
      responses:
        '200':
          description: Successfully retrieved the rankings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProminentPeople'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /people/{personId}:
    get:
      summary: Get a person and the films they worked on
      description: |
        Returns one person with the films they are credited on, newest first.
        Names come from the credits import: Japanese names are stored on the
        person, foreign names get their Japanese form from translations.
      operationId: getPerson
      tags:
        - Movies
      security: []
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Person UID
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum: [ja, en]
            default: ja
          description: Language for names and film titles
      responses:
        '200':
          description: Successfully retrieved the person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /crossings:
    get:
      summary: Get how awards overlap
      description: |
        Returns how often the award pages pick the same films: the film count of
        each award, the shared count of every award pair, how many films were
        picked by 1..13 awards, and the films picked by the most awards.
      operationId: getCrossings
      tags:
        - Awards
      security: []
      responses:
        '200':
          description: Successfully retrieved award crossings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardCrossings'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /uncrowned:
    get:
      summary: Get the most-nominated films that never won
      description: |
        Returns the films with the most nominations in the year-grouped award
        pages that never won any of them, with the awards and ceremony years
        they lost, plus how many nominated films exist and how many of them
        never won. Editorial lists are not counted.
      operationId: getUncrowned
      tags:
        - Awards
      security: []
      responses:
        '200':
          description: Successfully retrieved uncrowned films
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uncrowned'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /awards/{slug}:
    get:
      summary: Get an award page
      description: |
        Returns the movies of an award or editorial list grouped by ceremony year.
        Year-grouped awards return winners only (with `filmCount` per year); use
        `/awards/{slug}/{year}` for the full lineup. List awards are paginated.
        Personal awards (Best Director, acting awards) return every nominee per
        ceremony year with the films they were nominated for; they have no year
        pages.
      operationId: getAwardBySlug
      tags:
        - Awards
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for list-grouped awards (100 per page). Out-of-range pages return 404. Ignored for year-grouped awards
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Successfully retrieved the award page
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AwardDetail'
                  - $ref: '#/components/schemas/PersonAwardDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /awards/{slug}/{year}:
    get:
      summary: Get a single ceremony year of an award
      description: Returns one ceremony year of a year-grouped award, with neighboring ceremony years for navigation
      operationId: getAwardYear
      tags:
        - Awards
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved the award year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardYearDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /years:
    get:
      summary: List production years
      description: Returns every production year that has at least one film selected by an award or editorial list, newest first
      operationId: listYears
      tags:
        - Awards
      security: []
      responses:
        '200':
          description: Successfully retrieved years
          content:
            application/json:
              schema:
                type: object
                required: [years]
                properties:
                  years:
                    type: array
                    items:
                      $ref: '#/components/schemas/YearSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /years/{year}:
    get:
      summary: Get the films of a production year
      description: |
        Returns the films produced in the given year that were selected by any
        award or editorial list, with the awards each film appeared in, and the
        neighboring years that have films for navigation. Winners come first,
        then films with more selections.
      operationId: getYear
      tags:
        - Awards
      security: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved the year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /quiz/daily:
    get:
      summary: Get today's quiz
      description: Returns the puzzle date and the number of attempts. Never contains anything that identifies the answer
      operationId: getQuizDaily
      tags:
        - Quiz
      security: []
      parameters:
        - name: date
          in: query
          description: Puzzle date (YYYY-MM-DD). Defaults to today; future dates are rejected
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successfully retrieved the puzzle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizPuzzle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /quiz/candidates:
    get:
      summary: List every movie that can be guessed
      description: Returns the whole quiz pool so the client can filter guesses locally
      operationId: getQuizCandidates
      tags:
        - Quiz
      security: []
      responses:
        '200':
          description: Successfully retrieved the candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuizCandidate'
                required:
                  - candidates
        '500':
          $ref: '#/components/responses/InternalServerError'

  /quiz/guess:
    post:
      summary: Submit a guess
      description: Checks a guess server-side. Returns the next hint while attempts remain, and the answer once solved or after the last attempt
      operationId: submitQuizGuess
      tags:
        - Quiz
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                movieUid:
                  type: string
                  description: Omit to pass on this attempt
                attempt:
                  type: integer
                  minimum: 1
              required:
                - attempt
      responses:
        '200':
          description: Guess processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizGuessResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /quiz/answer:
    get:
      summary: Get the answer (internal)
      description: Returns the answer including the poster URL. Used by the frontend worker to render the cropped poster; requires the shared key
      operationId: getQuizAnswer
      tags:
        - Quiz
      security: []
      parameters:
        - name: X-Quiz-Key
          in: header
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successfully retrieved the answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizAnswer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/{id}/article-links:
    get:
      summary: Get movie article links
      description: Retrieve user-submitted article links for a specific movie (excluding spam-flagged items)
      operationId: getMovieArticleLinks
      tags:
        - Articles
      security: []
      parameters:
        - name: id
          in: path
          description: Movie unique identifier
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved article links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleLink'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Submit movie article link
      description: Submit a new article link for a movie (rate limited to 10 per hour per IP)
      operationId: submitMovieArticleLink
      tags:
        - Articles
      security: []
      parameters:
        - name: id
          in: path
          description: Movie unique identifier
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleLinkSubmission'
      responses:
        '201':
          description: Article link successfully submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleLinkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/{id}/translations:
    post:
      summary: Add or update movie translation
      description: Add or update a movie title translation for a specific language
      operationId: addMovieTranslation
      tags:
        - Translations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Movie unique identifier
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationRequest'
      responses:
        '200':
          description: Translation successfully added or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /movies/{id}/translations/{lang}:
    delete:
      summary: Delete movie translation
      description: Remove a movie title translation for a specific language
      operationId: deleteMovieTranslation
      tags:
        - Translations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Movie unique identifier
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          description: Language code
          required: true
          schema:
            type: string
            pattern: '^[a-z]{2}$'
      responses:
        '200':
          description: Translation successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /fetch-url-title:
    post:
      summary: Extract title from URL
      description: Utility endpoint to extract page title from a given URL
      operationId: fetchUrlTitle
      tags:
        - Utilities
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: URL to extract title from
      responses:
        '200':
          description: Successfully extracted title
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: Extracted page title
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      summary: Admin login
      description: Authenticate as admin and receive JWT token
      operationId: adminLogin
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: Admin password
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token (valid for 24 hours)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/movies:
    get:
      summary: List all movies (admin)
      description: Retrieve paginated list of all movies with admin details
      operationId: adminListMovies
      tags:
        - Admin - Movies
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: search
          in: query
          description: Search query for movie titles
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Successfully retrieved movies list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMoviesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create movie from IMDb ID (admin)
      description: Create a new movie from an IMDb ID, optionally importing TMDb data (posters and translations)
      operationId: adminCreateMovie
      tags:
        - Admin - Movies
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieCreateRequest'
      responses:
        '201':
          description: Movie successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/movies/{id}:
    get:
      summary: Get movie details (admin)
      description: Retrieve movie details for admin including all translations, posters, and nominations
      operationId: adminGetMovie
      tags:
        - Admin - Movies
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Movie unique identifier
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved movie details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMovieDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update movie basic info (admin)
