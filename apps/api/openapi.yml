              type: integer
              description: Number of translations added
          description: Results of TMDb data refresh (if refreshData was true)
      required:
        - success

    TmdbIdUpdateRequest:
      type: object
      properties:
        tmdbId:
          type: integer
          minimum: 1
          description: TMDb identifier (positive integer)
        refreshData:
          type: boolean
          default: false
          description: Whether to fetch additional data from TMDb
      required:
        - tmdbId

    TmdbIdUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        refreshResults:
          type: [object, 'null']
          properties:
            postersAdded:
              type: integer
              description: Number of posters added
            translationsAdded:
              type: integer
              description: Number of translations added
          description: Results of TMDb data refresh (if refreshData was true)
      required:
        - success

    PosterAddRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Poster image URL
        width:
          type: [integer, 'null']
          minimum: 1
          description: Image width in pixels
        height:
          type: [integer, 'null']
          minimum: 1
          description: Image height in pixels
        languageCode:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
          description: Language-specific poster
        isPrimary:
          type: boolean
          default: false
          description: Whether this should be the primary poster
      required:
        - url

    PosterResponse:
      allOf:
        - $ref: '#/components/schemas/Poster'
        - type: object
          properties:
            movieUid:
              type: string
              format: uuid
              description: Associated movie identifier
            createdAt:
              type: integer
              description: Creation timestamp
            updatedAt:
              type: integer
              description: Last update timestamp

    ReselectRequest:
      type: object
      properties:
        type:
          type: string
          enum: [daily, weekly, monthly]
          description: Selection period type
        locale:
          type: string
          enum: [en, ja]
          default: en
          description: Language preference
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Target date for the reselection (YYYY-MM-DD, defaults to today)
        excludeMovieUids:
          type: array
          items:
            type: string
            format: uuid
          description: Movie UIDs to exclude from the reselection
      required:
        - type

    ReselectResponse:
      type: object
      properties:
        type:
          type: string
          description: Selection period type
        movie:
          $ref: '#/components/schemas/MovieWithDetails'
      required:
        - type
        - movie

    MovieCreateRequest:
      type: object
      properties:
        imdbId:
          type: string
          pattern: '^tt\d{7,8}$'
          description: IMDb identifier in tt format
        refreshData:
          type: boolean
          default: true
          description: Whether to import posters and translations from TMDb
      required:
        - imdbId

    MovieCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        movie:
          type: object
          properties:
            uid:
              type: string
              format: uuid
              description: Unique identifier for the created movie
            imdbId:
              type: string
              description: IMDb identifier
            tmdbId:
              type: integer
              description: TMDb identifier
            year:
              type: integer
              description: Release year
            originalLanguage:
              type: string
              description: ISO 639-1 language code
          required:
            - uid
        imports:
          type: object
          properties:
            translationsAdded:
              type: integer
              description: Number of translations imported
            postersAdded:
              type: integer
              description: Number of posters imported
      required:
        - success
        - movie

    MovieUpdateRequest:
      type: object
      properties:
        year:
          type: integer
          minimum: 1888
          maximum: 2100
          description: Release year
        originalLanguage:
          type: string
          pattern: '^[a-z]{2}$'
          description: ISO 639-1 language code
        mediaType:
          type: string
          enum: [movie, tv]
          description: Media type

    AdminMovieDetails:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier for the movie
        year:
          type: [integer, 'null']
          description: Release year
        originalLanguage:
          type: string
          description: ISO 639-1 language code
        imdbId:
          type: [string, 'null']
          description: IMDb identifier (tt format)
        tmdbId:
          type: [integer, 'null']
          description: TMDb identifier
        mediaType:
          type: string
          enum: [movie, tv]
          description: Media type
        translations:
          type: array
          items:
            type: object
            properties:
              uid:
                type: string
                format: uuid
              languageCode:
                type: string
              content:
                type: string
              isDefault:
                type: integer
                description: 1 if this is the default translation
          description: All movie title translations
        posters:
          type: array
          items:
            $ref: '#/components/schemas/Poster'
          description: All poster images for the movie
        nominations:
          type: array
          items:
            type: object
            properties:
              uid:
                type: string
                format: uuid
              isWinner:
                type: integer
              specialMention:
                type: [string, 'null']
              categoryUid:
                type: string
                format: uuid
              categoryName:
                type: string
              ceremonyUid:
                type: string
                format: uuid
              ceremonyNumber:
                type: [integer, 'null']
              ceremonyYear:
                type: integer
              organizationUid:
                type: string
                format: uuid
              organizationName:
                type: string
              organizationShortName:
                type: [string, 'null']
          description: Awards and nominations with full details
      required:
        - uid
        - originalLanguage

    ExternalIdSearchResponse:
      type: object
      properties:
        usedQuery:
          type: string
          description: Query used for the TMDb search
        usedYear:
          type: integer
          description: Year used to bias search results
        results:
          type: array
          items:
            type: object
            properties:
              tmdbId:
                type: integer
                description: TMDb identifier
              imdbId:
                type: string
                description: IMDb identifier
              title:
                type: string
                description: Localized title
              originalTitle:
                type: string
                description: Original title
              releaseDate:
                type: string
                description: Release date (YYYY-MM-DD)
              overview:
                type: string
                description: Movie overview
              originalLanguage:
                type: string
                description: ISO 639-1 language code
              posterPath:
                type: string
                description: TMDb poster path
              popularity:
                type: number
                description: TMDb popularity score
              voteAverage:
                type: number
                description: TMDb vote average
              voteCount:
                type: integer
                description: TMDb vote count
              yearDifference:
                type: integer
                description: Absolute difference from the movie's stored year
            required:
              - tmdbId
              - title
          description: Candidate matches from TMDb
      required:
        - usedQuery
        - results

    AutoFetchTmdbResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        fetchResults:
          type: object
          properties:
            tmdbIdSet:
              type: boolean
              description: Whether a TMDb ID was newly detected and saved
            postersAdded:
              type: integer
              description: Number of posters added
            translationsAdded:
              type: integer
              description: Number of translations added
      required:
        - success
        - fetchResults

    MergeMoviesResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        message:
          type: string
          description: Merge result message
      required:
        - success
        - message

    NominationCreateRequest:
      type: object
      properties:
        ceremonyUid:
          type: string
          format: uuid
          description: Award ceremony identifier
        categoryUid:
          type: string
          format: uuid
          description: Award category identifier
        isWinner:
          type: boolean
          default: false
          description: Whether the nomination won the award
        specialMention:
          type: string
          description: Special mention or note about the nomination
      required:
        - ceremonyUid
        - categoryUid

    NominationUpdateRequest:
      type: object
      properties:
        isWinner:
          type: boolean
          description: Whether the nomination won the award
        specialMention:
          type: string
          description: Special mention or note about the nomination

    NominationRecord:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier for the nomination
        movieUid:
          type: string
          format: uuid
          description: Associated movie identifier
        ceremonyUid:
          type: string
          format: uuid
          description: Award ceremony identifier
        categoryUid:
          type: string
          format: uuid
          description: Award category identifier
        isWinner:
          type: integer
          description: 1 if the nomination won the award
        specialMention:
          type: [string, 'null']
          description: Special mention or note about the nomination
        createdAt:
          type: integer
          description: Creation timestamp (unix seconds)
        updatedAt:
          type: integer
          description: Last update timestamp (unix seconds)
      required:
        - uid
        - movieUid
        - ceremonyUid
        - categoryUid
        - isWinner

    CeremonyRequest:
      type: object
      properties:
        organizationUid:
          type: string
          format: uuid
          description: Award organization identifier
        year:
          type: integer
          minimum: 1880
          maximum: 9999
          description: Ceremony year
        ceremonyNumber:
          type: integer
          description: Ceremony number (e.g., 95th Academy Awards)
        startDate:
          type: integer
          description: Start date (unix seconds)
        endDate:
          type: integer
          description: End date (unix seconds)
        location:
          type: string
          description: Ceremony location
        description:
          type: string
          description: Ceremony description
        imdbEventUrl:
          type: string
          format: uri
          description: IMDb event page URL used for nomination sync
      required:
        - organizationUid
        - year

    CeremonySummary:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: Unique identifier for the ceremony
        organizationUid:
          type: string
          format: uuid
          description: Award organization identifier
        organizationName:
          type: string
          description: Organization name
        organizationCountry:
          type: [string, 'null']
          description: Organization country
        year:
          type: integer
          description: Ceremony year
        ceremonyNumber:
          type: [integer, 'null']
          description: Ceremony number
        startDate:
          type: [integer, 'null']
          description: Start date (unix seconds)
        endDate:
          type: [integer, 'null']
          description: End date (unix seconds)
        location:
          type: [string, 'null']
          description: Ceremony location
        description:
          type: [string, 'null']
          description: Ceremony description
        imdbEventUrl:
          type: [string, 'null']
          description: IMDb event page URL
        createdAt:
          type: integer
          description: Creation timestamp (unix seconds)
        updatedAt:
          type: integer
          description: Last update timestamp (unix seconds)
      required:
        - uid
        - organizationUid
        - organizationName
        - year

    CeremoniesListResponse:
      type: object
      properties:
        ceremonies:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CeremonySummary'
              - type: object
                properties:
                  movieCount:
                    type: integer
                    description: Number of distinct nominated movies
          description: Award ceremonies
      required:
        - ceremonies

    CeremonyDetail:
      allOf:
        - $ref: '#/components/schemas/CeremonySummary'
        - type: object
          properties:
            nominations:
              type: array
              items:
                type: object
                properties:
                  uid:
                    type: string
                    format: uuid
                  movieUid:
                    type: string
                    format: uuid
                  movieTitle:
                    type: string
                  movieYear:
                    type: [integer, 'null']
                  movieOriginalLanguage:
                    type: string
                  categoryUid:
                    type: string
                    format: uuid
                  categoryName:
                    type: string
                  isWinner:
                    type: integer
                  specialMention:
                    type: [string, 'null']
              description: Nominations for the ceremony

    AwardsDataResponse:
      type: object
      properties:
        organizations:
          type: array
          items:
            type: object
            properties:
              uid:
                type: string
                format: uuid
              name:
                type: string
              country:
                type: [string, 'null']
            required:
              - uid
              - name
          description: Award organizations
        ceremonies:
          type: array
          items:
            type: object
            properties:
              uid:
                type: string
                format: uuid
              organizationUid:
                type: string
                format: uuid
              year:
                type: integer
              ceremonyNumber:
                type: [integer, 'null']
              organizationName:
                type: string
              imdbEventUrl:
                type: [string, 'null']
            required:
              - uid
              - organizationUid
              - year
              - organizationName
          description: Award ceremonies
        categories:
          type: array
          items:
            type: object
            properties:
              uid:
                type: string
                format: uuid
              organizationUid:
                type: string
                format: uuid
              name:
                type: string
              organizationName:
                type: string
            required:
              - uid
              - organizationUid
              - name
              - organizationName
          description: Award categories
      required:
        - organizations
        - ceremonies
        - categories

    PreviewSelectionsResponse:
      type: object
      properties:
        nextDaily:
          $ref: '#/components/schemas/SelectionPreview'
        nextWeekly:
          $ref: '#/components/schemas/SelectionPreview'
        nextMonthly:
          $ref: '#/components/schemas/SelectionPreview'
      required:
        - nextDaily
        - nextWeekly
        - nextMonthly

    SelectionPreview:
      type: object
      properties:
        date:
          type: string
          description: Selection date (YYYY-MM-DD)
        movie:
          $ref: '#/components/schemas/MovieWithDetails'
      required:
        - date

    OverrideSelectionRequest:
      type: object
      properties:
        type:
          type: string
          enum: [daily, weekly, monthly]
          description: Selection period type
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Target selection date (YYYY-MM-DD)
        movieId:
          type: string
          format: uuid
          description: Movie to set as the selection
      required:
        - type
        - date
        - movieId

    CleanupFutureSelectionsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        currentDates:
          type: object
          properties:
            daily:
              type: string
              description: Current daily selection date
            weekly:
              type: string
              description: Current weekly selection date
            monthly:
              type: string
              description: Current monthly selection date
          description: Current selection dates per period
        deletedCount:
          type: object
          properties:
            daily:
              type: integer
              description: Deleted future daily selections
            weekly:
              type: integer
              description: Deleted future weekly selections
            monthly:
              type: integer
              description: Deleted future monthly selections
          description: Number of deleted selections per period
      required:
        - success
        - currentDates
        - deletedCount

    RandomMoviePreviewRequest:
      type: object
      properties:
        type:
          type: string
          enum: [daily, weekly, monthly]
          description: Selection period type
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Target date (YYYY-MM-DD)
        locale:
          type: string
          enum: [en, ja]
          default: en
          description: Language preference
      required:
        - type
        - date

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: [object, 'null']
          description: Additional error details
      required:
        - error
        - code

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Validation failed'
            code: 'VALIDATION_ERROR'
            details:
              field: 'Field validation message'

    UnauthorizedError:
      description: Authentication error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Authentication required'
            code: 'AUTHENTICATION_ERROR'
            details:
              reason: 'MISSING_TOKEN'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Resource not found'
            code: 'NOT_FOUND'

    ConflictError:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Resource already exists'
            code: 'CONFLICT'

    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Rate limit exceeded'
            code: 'RATE_LIMIT_EXCEEDED'
            details:
              retryAfter: 3600

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Internal server error'
            code: 'INTERNAL_ERROR'

