              organization:
                type: string
              filmCount:
                type: integer
            required: [slug, name, shortLabel, organization, filmCount]
        pairs:
          type: array
          description: Award pairs that share at least one film, most shared first
          items:
            type: object
            properties:
              a:
                type: string
                description: Slug of the first award, alphabetically before `b`
              b:
                type: string
              shared:
                type: integer
                description: Number of films picked by both awards
            required: [a, b, shared]
        distribution:
          type: array
          description: How many films were picked by exactly N awards, N descending
          items:
            type: object
            properties:
              awardCount:
                type: integer
              filmCount:
                type: integer
            required: [awardCount, filmCount]
        topMovies:
          type: array
          description: Films picked by the most awards, at most 24
          items:
            type: object
            properties:
              uid:
                type: string
                format: uuid
              title:
                type: [string, 'null']
              year:
                type: [integer, 'null']
              posterUrl:
                type: [string, 'null']
              awardSlugs:
                type: array
